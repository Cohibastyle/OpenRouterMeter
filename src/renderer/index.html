<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <title>OpenRouter Meter</title>
    <link rel="stylesheet" href="styles/app.css" />
  </head>
  <body>
    <div id="root" class="root" data-mode="standard" data-width-class="m" data-height-class="regular">
      <div class="shell">
        <header class="statusbar" id="statusbar">
          <div class="drag-region" id="drag-region" title="Drag to move">
            <span class="app-title" id="app-title">OpenRouter Meter</span>
            <span class="status-dot" id="status-dot" aria-hidden="true"></span>
            <span class="status-text" id="status-text">Connecting</span>
            <span class="status-age" id="status-age"></span>
            <span class="sample-badge" id="sample-badge" hidden>Sample data</span>
          </div>
          <div class="window-controls">
            <button class="icon-btn" id="btn-refresh" title="Refresh now" aria-label="Refresh now">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5a5.5 5.5 0 1 0 5.2 3.7l-1.4.5A4 4 0 1 1 8 4v1.6L10.8 3 8 0.4V2.5z"/></svg>
            </button>
            <button class="icon-btn" id="btn-minimize" title="Minimize" aria-label="Minimize">
              <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7.4" width="10" height="1.4"/></svg>
            </button>
            <button class="icon-btn" id="btn-close" title="Hide widget" aria-label="Hide widget">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
            </button>
          </div>
        </header>

        <div class="banner" id="banner" hidden>
          <span id="banner-text"></span>
          <button class="link-btn" id="banner-action">Fix in Settings</button>
        </div>

        <main class="content" id="content"></main>

        <nav class="tabbar" id="tabbar" role="tablist" aria-label="Widget sections"></nav>
      </div>
      <div class="resize-handle" id="resize-handle" title="Resize"></div>
      <div class="size-readout" id="size-readout" hidden></div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
