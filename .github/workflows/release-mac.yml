name: Build macOS DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build DMG (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'aarch64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}

      - name: Cache Rust artefacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build frontend
        run: npm run build

      # The frontend is bundled into the binary, so the DMG contains only the
      # app and the WebKit shell it borrows from the system: no browser runtime.
      #
      # `npx tauri` rather than `cargo tauri`: the CLI is a pinned devDependency,
      # so `npm ci` provides it. A bare `cargo tauri` needs a global install that
      # a fresh runner does not have, and `cargo install tauri-cli` would compile
      # the CLI from source on every run.
      - name: Build DMG
        run: npx tauri build --bundles dmg --target ${{ matrix.arch }}-apple-darwin
        env:
          CI: true

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Attach DMG to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/**/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: true
